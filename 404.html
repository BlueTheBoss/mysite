<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.ERR // 404 // ARMAAN AHMAD ANSARI</title>
    <meta name="description" content="Page not found.">
    
    <!-- Fonts (self-hosted) -->
    <link rel="preload" href="assets/fonts/space-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/anton-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='30' fill='%230D1824'/%3E%3Cpath fill='%235B8DB8' d='M50 20 L58 42 L80 50 L58 58 L50 80 L42 58 L20 50 L42 42 Z'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0D1824; /* Base dark terminal color */
            color: var(--text-primary);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .error-container {
            text-align: left;
            padding: 0;
            border: 4px solid var(--text-primary);
            background-color: #111;
            box-shadow: 15px 15px 0px 0px var(--accent-base);
            max-width: min(680px, 92%);
            position: relative;
            overflow: hidden;
        }

        /* ---- Terminal window ---- */
        .err-term {
            font-family: 'Courier New', Courier, monospace;
        }

        .err-term-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: #1a1a1a;
            border-bottom: 2px solid var(--text-primary);
        }

        .err-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-base);
            opacity: 0.85;
        }

        .err-dot:nth-child(2) { opacity: 0.55; }
        .err-dot:nth-child(3) { opacity: 0.3; }

        .err-term-bar em {
            font-style: normal;
            font-size: 0.85rem;
            color: #888;
            margin-left: 0.5rem;
            flex: 1;
        }

        .err-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: #111;
            background: var(--accent-base);
            padding: 0.1rem 0.6rem;
        }

        .err-term-body {
            padding: 1.75rem 1.5rem 2rem;
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
            line-height: 1.7;
            color: #e6f2ff;
        }

        .err-line {
            margin-bottom: 1rem;
            word-break: break-all;
        }

        .err-prompt {
            color: var(--accent-base);
            font-weight: bold;
        }

        .blinking-cursor {
            animation: blink 1s step-end infinite;
            font-weight: bold;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .err-reveal {
            display: none;
        }

        .err-reveal.shown {
            display: block;
            animation: errIn 0.3s ease both;
        }

        @keyframes errIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .err-reveal p { margin-bottom: 0.4rem; }

        .err-dim {
            color: #7d8ea3;
        }

        #err-suggest { margin-top: 1.25rem; }

        #err-suggest a {
            display: block;
            color: #e6f2ff;
            text-decoration: none;
            padding: 0.35rem 0.5rem;
            margin: 0.15rem -0.5rem;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
        }

        #err-suggest a:hover {
            background: var(--accent-base);
            color: #111;
            border-left-color: #e6f2ff;
            transform: translateX(4px);
        }

        #err-suggest a:hover .err-dim {
            color: #111;
        }

        /* Glitch overlay line */
        .glitch-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-base);
            opacity: 0.5;
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>

<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <!-- Dynamic Dotted Grid Background -->
    <canvas id="dynamic-bg-grid" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:-1;"></canvas>

    <div class="error-container">
        <div class="glitch-line"></div>

        <!-- Terminal window -->
        <div class="err-term">
            <div class="err-term-bar">
                <span class="err-dot"></span><span class="err-dot"></span><span class="err-dot"></span>
                <em>armaan@archlinux: ~/404</em>
                <span class="err-badge">404</span>
            </div>
            <div class="err-term-body">
                <p class="err-line">
                    <span class="err-prompt">$</span>
                    <span id="err-cmd"></span><span class="blinking-cursor">▮</span>
                </p>
                <div id="err-output" class="err-reveal">
                    <p>bash: visit: command not found</p>
                    <p class="err-dim">hint: this page drifted off into the void.</p>
                </div>
                <div id="err-suggest" class="err-reveal">
                    <p class="err-dim">did you mean:</p>
                    <a href="/"><span class="err-prompt">$</span> cd /home <span class="err-dim">-- portfolio</span></a>
                    <a href="/music"><span class="err-prompt">$</span> play /vibeplayer <span class="err-dim">-- audio vault (PIN required)</span></a>
                    <a href="/#contact"><span class="err-prompt">$</span> ping armaan <span class="err-dim">-- contact</span></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Load scripts for cursor and canvas background -->
    <script src="script.js"></script>
</body>

</html>
